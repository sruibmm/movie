name: Verify live Cinema source-sync rollout
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          base='https://movie.o-a-f-a.workers.dev'
          for p in ['/', '/api/source-sync/status', '/api/source-sync/catalog', '/api/dailymotion-player?video=x6rtfip']:
            try:
              with urllib.request.urlopen(urllib.request.Request(base+p,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}),timeout=12) as r:
                body=r.read(1000).decode('utf8','replace')
                print('LIVE '+json.dumps({'path':p,'status':r.status,'type':r.headers.get('Content-Type'),'body':body[:400] if p!='/' else body[:100]}),flush=True)
            except urllib.error.HTTPError as e:
              print('LIVE '+json.dumps({'path':p,'status':e.code,'body':e.read(300).decode('utf8','replace')}),flush=True)
            except Exception as e: print('LIVE '+json.dumps({'path':p,'error':str(e)}),flush=True)
          PY
