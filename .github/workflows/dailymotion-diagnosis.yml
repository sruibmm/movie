name: AlooYTV normal user playback capability audit
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: npm install --no-save playwright && npx playwright install chromium
      - run: |
          cat > audit.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});
            const p=await b.newPage({viewport:{width:1280,height:800}});
            const info=async()=>p.evaluate(()=>({title:document.title,headings:[...document.querySelectorAll('h1,h2,h3')].map(x=>x.textContent.trim().slice(0,100)).slice(0,14),text:document.body.innerText.slice(0,1100),video:document.querySelectorAll('video').length,iframes:document.querySelectorAll('iframe').length}));
            await p.goto('https://aloooytv.com/',{waitUntil:'domcontentloaded',timeout:20000});
            const link=p.locator('a').filter({hasText:'شاهد الآن'}).first();
            const entry=new URL(await link.getAttribute('href'),p.url());
            if(entry.origin!=='https://aloooytv.com')throw Error('unexpected entry');
            await p.goto(entry.href,{waitUntil:'domcontentloaded',timeout:25000});await p.waitForTimeout(2000);
            const search=p.locator('input[type=search],input[placeholder*="بحث"],input[placeholder*="Search" i]').first();
            if(await search.count()){
              await search.fill('جعفر العمدة');await search.press('Enter').catch(()=>{});await p.waitForTimeout(4000);
            }
            console.log('SEARCH',JSON.stringify(await info()));
            let title=p.locator('a').filter({hasText:/جعفر العمدة/}).first();
            if(!await title.count()){
              await p.goto(entry.href,{waitUntil:'domcontentloaded',timeout:25000});
              title=p.locator('a').filter({hasText:/سقف الوالد/}).first();
            }
            if(!await title.count()){console.log('RESULT no title link');return await b.close();}
            await title.click({timeout:10000});await p.waitForTimeout(2500);
            console.log('TITLE',JSON.stringify(await info()));
            const episodes=await p.locator('a').evaluateAll(es=>es.map(e=>({text:e.innerText.trim().slice(0,100)})).filter(x=>/الحلقة|حلقة/i.test(x.text)).slice(0,40));
            console.log('EPISODES',JSON.stringify(episodes));
            const ep=p.locator('a').filter({hasText:/الحلقة\s*(?:1|١)(?![0-9٠-٩])|الحلقة الأولى/}).first();
            if(!await ep.count()){console.log('RESULT no episode link');return await b.close();}
            await ep.click({timeout:10000});await p.waitForTimeout(3500);
            console.log('EPISODE',JSON.stringify(await info()));
            const play=p.getByRole('button',{name:/تشغيل|مشاهدة|play/i}).first();
            if(await play.count())await play.click({timeout:3000}).catch(()=>{});
            await p.waitForTimeout(8000);
            const frames=[];
            for(const f of p.frames()){
              try{const result=await f.evaluate(()=>({video:[...document.querySelectorAll('video')].map(v=>({time:v.currentTime,duration:Number.isFinite(v.duration)?v.duration:null,height:v.videoHeight,width:v.videoWidth,ready:v.readyState,paused:v.paused,error:v.error?.code||null})),iframeCount:document.querySelectorAll('iframe').length,title:document.title}));frames.push(result);}catch{}
            }
            console.log('RESULT',JSON.stringify({page:await info(),frames}));
            await b.close();
          })().catch(e=>{console.log('RESULT error',e.message.slice(0,200));process.exit(1)});
          JS
          node audit.cjs
