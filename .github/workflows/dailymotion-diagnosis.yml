name: Verify separate Gaafar episode selections
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: npm install --no-save playwright && npx playwright install chromium
      - run: |
          cat > audit.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});
            const p=await b.newPage({viewport:{width:1280,height:800}});
            await p.goto('https://aloooytv.com/',{waitUntil:'domcontentloaded',timeout:18000});
            const entry=new URL(await p.locator('a').filter({hasText:'شاهد الآن'}).first().getAttribute('href'),p.url());
            if(entry.origin!=='https://aloooytv.com')throw Error('unexpected entry');
            await p.goto(entry.href,{waitUntil:'domcontentloaded',timeout:20000});
            const search=p.locator('input[type=search],input[placeholder*="بحث"],input[placeholder*="Search" i]').first();
            await search.fill('جعفر العمدة');await search.press('Enter');
            await p.locator('a').filter({hasText:/جعفر العمدة/}).first().click({timeout:12000});
            await p.waitForTimeout(1200);
            const seriesPage=p.url();
            const episodes=await p.locator('a').evaluateAll(es=>es.filter(e=>/^EP#(?:1|30)$/.test(e.textContent.trim())).map(e=>({label:e.textContent.trim(),href:e.getAttribute('href'),visible:!!e.getClientRects().length})));
            console.log('NAV',JSON.stringify(episodes.map(e=>({label:e.label,visible:e.visible,hasPageHref:!!e.href&&!/^(#|javascript:)/i.test(e.href)}))));
            for(const n of [1,30]){
              const a=episodes.find(e=>e.label==='EP#'+n);
              if(!a){console.log('EP'+n,'no public episode anchor');continue;}
              if(a.href&&!/^(#|javascript:)/i.test(a.href)){
                const u=new URL(a.href,seriesPage);
                if(u.origin!==new URL(seriesPage).origin){console.log('EP'+n,'external page, skipped');continue;}
                await p.goto(u.href,{waitUntil:'domcontentloaded',timeout:18000});
              }else{
                await p.goto(seriesPage,{waitUntil:'domcontentloaded',timeout:18000});
                const season=p.getByText('S 01',{exact:true}).filter({visible:true}).first();
                if(await season.count())await season.click({timeout:3000}).catch(()=>{});
                const choice=p.getByText('EP#'+n,{exact:true}).filter({visible:true}).first();
                if(!await choice.count()){console.log('EP'+n,'no visible episode selection');continue;}
                await choice.click({timeout:4000});
              }
              const v=p.locator('video').first();
              if(await v.count())await v.evaluate(v=>{v.muted=true;v.play().catch(()=>{});});
              await p.waitForTimeout(6000);
              console.log('EP'+n,JSON.stringify({title:await p.title(),pageChanged:p.url()!==seriesPage,video:await p.locator('video').evaluateAll(vs=>vs.map(v=>({time:v.currentTime,duration:Number.isFinite(v.duration)?v.duration:null,height:v.videoHeight,width:v.videoWidth,ready:v.readyState,paused:v.paused,error:v.error?.code||null}))),activeLabels:await p.locator('a.active,li.active,button.active,[aria-current=true]').evaluateAll(es=>es.map(e=>e.textContent.trim()).filter(t=>/^EP#/.test(t)).slice(0,5))}));
            }
            await b.close();
          })().catch(e=>{console.log('ERROR',e.message.slice(0,180));process.exit(1)});
          JS
          node audit.cjs
