name: AlooYTV public reference site suitability audit
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public reference pages, headers and structured catalogue evidence
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, urllib.parse, json, re, concurrent.futures
          from html.parser import HTMLParser
          base='https://aloooytv.com'
          class P(HTMLParser):
            def __init__(self):super().__init__();self.count={};self.links=[];self.types=[];self.scripts=0
            def handle_starttag(self,t,a):
              self.count[t]=self.count.get(t,0)+1;d=dict(a)
              if t=='a' and d.get('href'):self.links.append(d['href'])
              if t=='script' and d.get('type')=='application/ld+json':self.scripts+=1
          def audit(path):
            try:
              req=urllib.request.Request(base+path,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=12) as r:
                body=r.read(2000000).decode('utf8','replace');p=P();p.feed(body)
                hosts=sorted(set(urllib.parse.urlsplit(urllib.parse.urljoin(base,x)).hostname or '' for x in p.links))
                out={'path':path,'status':r.status,'finalHost':urllib.parse.urlsplit(r.url).hostname,'bytes':len(body),'videoTags':p.count.get('video',0),'iframes':p.count.get('iframe',0),'links':len(p.links),'externalHosts':[x for x in hosts if x not in ('aloooytv.com','www.aloooytv.com','')],'jsonLd':p.scripts,'videoObject':bool(re.search(r'"@type"\s*:\s*"VideoObject"',body)),'csp':bool(r.headers.get('Content-Security-Policy')),'xFrame':r.headers.get('X-Frame-Options')}
            except Exception as e:out={'path':path,'error':str(e)[:200]}
            print('AUDIT '+json.dumps(out,ensure_ascii=False),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:list(ex.map(audit,['/','/official-links','/series','/ramadan-series','/editorial-policy','/disclaimer','/terms','/contact-us']))
          PY
