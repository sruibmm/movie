name: AlooYTV reference link provenance and public metadata audit
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re, json
          from html.parser import HTMLParser
          class P(HTMLParser):
            def __init__(self):super().__init__();self.a=None;self.links=[];self.title='';self.in_title=False
            def handle_starttag(self,t,attrs):
              d=dict(attrs)
              if t=='a':self.a=[d.get('href',''),'']
              if t=='title':self.in_title=True
            def handle_data(self,d):
              if self.a is not None:self.a[1]+=d
              if self.in_title:self.title+=d
            def handle_endtag(self,t):
              if t=='a' and self.a is not None:self.links.append(self.a);self.a=None
              if t=='title':self.in_title=False
          def get(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=12) as r:
              p=P();p.feed(r.read(1500000).decode('utf8','replace'));return r,p
          for path in ['','/official-links','/en/terms','/en/disclaimer','/en/contact-us','/series']:
            try:
              r,p=get('https://aloooytv.com'+path)
              out={'page':path,'status':r.status,'title':p.title.strip(),'watchLinks':[]}
              for href,label in p.links:
                label=' '.join(label.split())
                if re.search(r'شاهد الآن|المشاهدة الآن|watch now|tv2tv|الرابط الرسمي|مشاهدة مباشرة',label,re.I):
                  u=urllib.parse.urlsplit(urllib.parse.urljoin(r.url,href));out['watchLinks'].append({'label':label[:100],'host':u.hostname,'sameSite':u.hostname=='aloooytv.com','scheme':u.scheme,'pathCategory':'root' if u.path in ('','/') else 'non-root'})
              print('META '+json.dumps(out,ensure_ascii=False),flush=True)
            except Exception as e: print('META '+json.dumps({'page':path,'error':str(e)}),flush=True)
          PY
