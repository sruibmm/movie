name: Inspect supplied media link metadata
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          url='https://vid2.zvde-dsn-01.site/file/wp-alooytv/uploads/ramadan2023/Jafar.El.Omda/30.jpg'
          for method,origin in [('HEAD',None),('GET','https://movie.o-a-f-a.workers.dev')]:
            try:
              headers={'User-Agent':'Mozilla/5.0'}
              if origin:headers.update({'Origin':origin,'Range':'bytes=0-127'})
              req=urllib.request.Request(url,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=15) as r:
                data=r.read(128) if method=='GET' else b''
                print('META',json.dumps({'method':method,'status':r.status,'type':r.headers.get('Content-Type'),'length':r.headers.get('Content-Length'),'range':r.headers.get('Content-Range'),'cors':r.headers.get('Access-Control-Allow-Origin'),'mp4Signature':len(data)>8 and data[4:8]==b'ftyp','jpegSignature':data.startswith(b'\xff\xd8\xff')},ensure_ascii=False))
            except urllib.error.HTTPError as e:print('META',json.dumps({'method':method,'status':e.code,'type':e.headers.get('Content-Type')}))
            except Exception as e:print('META',json.dumps({'method':method,'error':str(e)[:180]}))
          PY
