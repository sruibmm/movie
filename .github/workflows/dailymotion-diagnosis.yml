name: Dailymotion public embed diagnosis
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public publisher player discovery
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, concurrent.futures
          urls=[
            'https://api.dailymotion.com/user/x266vhm?fields=id,username,screenname,website_url',
            'https://api.dailymotion.com/user/x266vhm/players?fields=id,label,private,embed_html_url',
            'https://api.dailymotion.com/v2/profiles/x266vhm/players?fields=player_id,visibility,endpoints.iframe_url',
            'https://partner.api.dailymotion.com/rest/user/x266vhm/players?fields=id,label,private,embed_html_url'
          ]
          def probe(url):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}),timeout=10)
              except urllib.error.HTTPError as e: r=e
              except Exception as e: return (url,str(e))
              return (url,r.status,r.read(8000).decode('utf-8','replace'))
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as e:
              for result in e.map(probe,urls): print(result)
          PY
