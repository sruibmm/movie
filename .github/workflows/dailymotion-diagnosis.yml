name: Verify public Gaafar episode playback using normal controls
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: npm install --no-save playwright && npx playwright install chromium
      - run: |
          cat > audit.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});
            const p=await b.newPage({viewport:{width:1280,height:800}});
            const media=[];
            p.on('response',r=>{const type=r.headers()['content-type']||'';if(/mpegurl|dash\+xml|video\//i.test(type)||r.request().resourceType()==='media')media.push({status:r.status(),type:type.split(';')[0]});});
            await p.goto('https://aloooytv.com/',{waitUntil:'domcontentloaded',timeout:20000});
            const link=p.locator('a').filter({hasText:'شاهد الآن'}).first();
            const entry=new URL(await link.getAttribute('href'),p.url());
            if(entry.origin!=='https://aloooytv.com')throw Error('unexpected entry');
            await p.goto(entry.href,{waitUntil:'domcontentloaded',timeout:25000});
            const search=p.locator('input[type=search],input[placeholder*="بحث"],input[placeholder*="Search" i]').first();
            await search.fill('جعفر العمدة');await search.press('Enter');await p.waitForTimeout(2500);
            await p.locator('a').filter({hasText:/جعفر العمدة/}).first().click({timeout:10000});
            await p.waitForTimeout(2500);
            console.log('CONTROLS',JSON.stringify(await p.locator('a,button,[role=button],li,span').evaluateAll(es=>es.filter(e=>/^EP#(?:1|30)$/.test(e.innerText?.trim()||'')).slice(0,12).map(e=>({tag:e.tagName,text:e.innerText.trim(),role:e.getAttribute('role')})))));
            async function inspect(label){
              const data=await p.locator('video').evaluateAll(vs=>vs.map(v=>({ready:v.readyState,paused:v.paused,time:v.currentTime,duration:Number.isFinite(v.duration)?v.duration:null,width:v.videoWidth,height:v.videoHeight,error:v.error?.code||null,controls:v.controls,srcPresent:!!(v.currentSrc||v.src),sourceCount:v.querySelectorAll('source').length})));
              console.log(label,JSON.stringify({video:data,media:media.slice(-10),login:/تسجيل الدخول|sign in/i.test(await p.locator('body').innerText())}));
            }
            for(const number of [1,30]){
              const ep=p.getByText('EP#'+number,{exact:true}).filter({visible:true}).first();
              if(await ep.count()){await ep.click({timeout:8000}).catch(e=>console.log('CLICK',number,e.message.slice(0,100)));await p.waitForTimeout(2500);}
              else console.log('NO_CONTROL',number);
              const video=p.locator('video').first();
              if(await video.count()){await video.evaluate(v=>{v.muted=true;return v.play().catch(e=>e.name)}).catch(()=>{});}
              await p.waitForTimeout(8500);
              await inspect('EP'+number);
            }
            await b.close();
          })().catch(e=>{console.log('ERROR',e.message.slice(0,160));process.exit(1)});
          JS
          node audit.cjs
