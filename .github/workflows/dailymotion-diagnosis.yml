name: AlooYTV public catalogue and player capability
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: npm install --no-save playwright && npx playwright install chromium
      - run: |
          cat > audit.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1280,height:800}});
            await p.goto('https://aloooytv.com/',{waitUntil:'domcontentloaded',timeout:20000});
            const link=p.locator('a').filter({hasText:'شاهد الآن'}).first();
            if(!await link.count()){console.log('RESULT no watch entry');return await b.close();}
            const href=await link.getAttribute('href');
            const entry=new URL(href,p.url());
            if(entry.origin!=='https://aloooytv.com'){console.log('RESULT unexpected entry');return await b.close();}
            const r=await p.goto(entry.href,{waitUntil:'domcontentloaded',timeout:25000}).catch(e=>null);
            await p.waitForTimeout(3500);
            const info=await p.evaluate(()=>({title:document.title,headings:[...document.querySelectorAll('h1,h2,h3')].map(x=>x.textContent.trim().slice(0,100)).slice(0,20),links:document.querySelectorAll('a').length,video:document.querySelectorAll('video').length,iframes:document.querySelectorAll('iframe').length,search:[...document.querySelectorAll('input')].filter(x=>x.type==='search'||/بحث|search/i.test(x.placeholder)).length,hasGaafar:document.body.innerText.includes('جعفر العمدة'),hasLogin:/تسجيل الدخول|sign in/i.test(document.body.innerText),hasBlocked:/access denied|blocked|verify you are human/i.test(document.body.innerText),bodySample:document.body.innerText.slice(0,600)}));
            console.log('RESULT',JSON.stringify({status:r?.status(),host:new URL(p.url()).hostname,info}));
            await b.close();
          })().catch(e=>{console.log('RESULT error',e.message.slice(0,200));process.exit(1)});
          JS
          node audit.cjs
