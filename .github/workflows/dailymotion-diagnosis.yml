name: Dubai Plus public frame compatibility check
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check standard HTTP frame policies
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, urllib.parse
          urls=['https://www.dubaiplus.net/web/','https://www.dubaiplus.net/web/ar-AE/s/series/694469160205_'+urllib.parse.quote('جعفر-العمدة')]
          for u in urls:
              req=urllib.request.Request(u,method='HEAD',headers={'User-Agent':'Mozilla/5.0'})
              try:r=urllib.request.urlopen(req,timeout=10)
              except urllib.error.HTTPError as e:r=e
              except Exception as e:print('ERROR',str(e));continue
              print('HTTP',r.status,r.url)
              for k in ['X-Frame-Options','Content-Security-Policy','Content-Security-Policy-Report-Only']:
                  print(k,r.headers.get(k))
          PY
