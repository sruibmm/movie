name: Dubai Plus manifest format diagnostic
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: npm install --no-save playwright && npx playwright install chromium
      - name: Classify guest-visible manifest metadata only
        run: |
          cat > audit.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1280,height:800}});
            const reports=[];const pending=[];
            p.on('response',r=>{
              const ct=r.headers()['content-type']||'';
              if(!/dash\+xml|mpegurl/i.test(ct))return;
              pending.push((async()=>{try{
                const body=await r.text();
                const durations=[...body.matchAll(/mediaPresentationDuration="([^"]+)"/g)].map(m=>m[1]);
                const heights=[...new Set([...body.matchAll(/\bheight="(\d+)"/g)].map(m=>Number(m[1])))].sort((a,b)=>a-b);
                reports.push({status:r.status(),host:new URL(r.url()).hostname,type:ct.split(';')[0],isMPD:/<MPD\b/i.test(body),durations,heights,contentProtection:/<ContentProtection\b/i.test(body),widevine:/edef8ba9-79d6-4ace-a3c8-27dcd51d21ed/i.test(body),playready:/9a04f079-9840-4286-ab92-e65be0885f95/i.test(body),encryptedMarkers:/cenc:default_KID|cenc:pssh|urn:mpeg:dash:mp4protection/i.test(body),segmentTemplate:/<SegmentTemplate\b/i.test(body)});
              }catch(e){reports.push({error:e.message.slice(0,100)});}})());
            });
            await p.goto('https://www.dubaiplus.net/ar-AE/s/series/694468136197_'+encodeURIComponent('النار-بالنار'),{waitUntil:'domcontentloaded'});
            const btn=p.getByRole('button',{name:'الموسم1 الحلقة1',exact:true}).first();await btn.waitFor({state:'visible',timeout:25000});
            const cookie=p.getByRole('button',{name:'رفض الكل',exact:true}).filter({visible:true}).first();if(await cookie.count())await cookie.click({timeout:2500}).catch(()=>{});
            await btn.click({timeout:8000});await p.waitForTimeout(10000);await Promise.allSettled(pending);
            console.log('MANIFEST_CLASSIFICATION '+JSON.stringify(reports));
            console.log('GUEST_STATE '+JSON.stringify({login:(await p.locator('body').innerText()).includes('أنشئ حسابًا أو سجّل الدخول للمتابعة'),videoCount:await p.locator('video').count()}));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node audit.cjs
