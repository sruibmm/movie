name: Dubai Plus playback audit with explicit player interaction
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: npm install --no-save playwright && npx playwright install chromium
      - name: Check official guest playback
        run: |
          cat > audit.cjs <<'JS'
          const {chromium}=require('playwright');
          const rows=[
          ['جعفر العمدة','s/series/694469160205_جعفر-العمدة',true],
          ['تحت الوصاية','s/series/694466600449_تحت-الوصاية',true],
          ['النار بالنار','s/series/694468136197_النار-بالنار',true],
          ['مال القبان','s/series/693423144332_مال-القبان',true],
          ['Blacklight','m/movie/803827752104_Blacklight',false],
          ['Born a Champion','m/movie/803801640170_Born-a-Champion',false]];
          (async()=>{
          const b=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});
          await Promise.all(rows.map(async([title,path,tv])=>{
           const p=await b.newPage({viewport:{width:1280,height:800}});
           const u='https://www.dubaiplus.net/ar-AE/'+path;
           const result={title,clicked:false};
           try{
            await p.goto(u,{waitUntil:'domcontentloaded',timeout:30000});
            const btn=p.getByRole('button',{name:tv?'الموسم1 الحلقة1':'تشغيل',exact:true}).first();
            await btn.waitFor({state:'visible',timeout:25000});
            const cookie=p.getByRole('button',{name:'رفض الكل',exact:true}).filter({visible:true}).first();
            if(await cookie.count())await cookie.click({timeout:2500}).catch(()=>{});
            await btn.click({timeout:8000});result.clicked=true;
            await p.waitForTimeout(7000);
            const body=await p.locator('body').innerText();
            result.loginRequired=body.includes('أنشئ حسابًا أو سجّل الدخول للمتابعة')||body.includes('قم بتسجيل الدخول إلى حساب دبي');
            result.premium=body.includes('محتوى متميز');
            result.videos=await p.locator('video').evaluateAll(vs=>vs.map(v=>({time:v.currentTime,duration:Number.isFinite(v.duration)?v.duration:null,ready:v.readyState,width:v.videoWidth,height:v.videoHeight})));
            result.publicPlayback=result.videos.some(v=>v.time>1&&v.duration>600&&v.width>0);
           }catch(e){result.error=e.message.slice(0,180);}
           console.log('RESULT '+JSON.stringify(result));await p.close();
          }));await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node audit.cjs
