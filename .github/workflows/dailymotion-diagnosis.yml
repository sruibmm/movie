name: Dubai Plus official play button verification
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: npm install --no-save playwright && npx playwright install chromium
      - name: Test standard free playback
        run: |
          cat > check.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});
            const p=await b.newPage({viewport:{width:1280,height:800}});
            const target='https://www.dubaiplus.net/ar-AE/s/series/694469160205_'+encodeURIComponent('جعفر-العمدة');
            const origin='https://movie.o-a-f-a.workers.dev/__dubai-frame-test';
            await p.route(origin,r=>r.fulfill({contentType:'text/html',body:'<!doctype html><iframe src="'+target+'" style="width:100%;height:750px" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>'}));
            await p.goto(origin,{waitUntil:'domcontentloaded'});
            await p.waitForTimeout(5500);
            const f=p.frames().find(x=>x.url().includes('dubaiplus.net/ar-AE/s/series'));
            if(!f)throw Error('No frame');
            const cookies=f.getByRole('button',{name:'رفض الكل',exact:true}).filter({visible:true}).first();
            if(await cookies.count())await cookies.click({timeout:2500}).catch(()=>{});
            const play=f.getByRole('button',{name:'الموسم1 الحلقة1',exact:true});
            await play.click({timeout:8000}).catch(e=>console.log('CLICK_FAIL',e.message.slice(0,300)));
            await p.waitForTimeout(12000);
            for(const x of p.frames()){if(!x.url().includes('dubaiplus.net'))continue;console.log('URL',x.url());console.log('TEXT',(await x.locator('body').innerText().catch(()=>'' )).slice(0,1000));console.log('VIDEO',JSON.stringify(await x.locator('video').evaluateAll(vs=>vs.map(v=>({time:v.currentTime,duration:v.duration,ready:v.readyState,paused:v.paused,error:v.error?.message||null}))).catch(()=>[])));}
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.cjs
