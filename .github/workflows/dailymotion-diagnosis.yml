name: Validate expanded Cinema catalogue
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ea0e4b4cc4024b667715df36a7fd9acecfc9ada1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:cloudflare
      - name: Verify Dubai Plus catalogue
        run: |
          node --input-type=module -e "import {DUBAI_PLUS_TITLES as t} from './src/dubaiPlusCatalog.js'; console.log('DUBAI_DIRECTORY',t.length,new Set(t.map(x=>x.id)).size,t.every(x=>!x.playbackVerified)); if(t.length!==16||new Set(t.map(x=>x.id)).size!==16)process.exit(1)"
