name: Verify Cinema playback UI cleanup
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f35696ee42cda6acfade5c17a24b69665ff9e12a
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:cloudflare
