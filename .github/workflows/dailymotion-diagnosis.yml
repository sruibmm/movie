name: Tabie official public playback evaluation
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: npm install --no-save playwright && npx playwright install chromium
      - name: Inspect normal playback and quality
        run: |
          cat > audit.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});
            const p=await b.newPage({viewport:{width:1280,height:800}});
            const media=[];
            p.on('response',r=>{const ct=r.headers()['content-type']||'';if(/mpegurl|dash\+xml|video\//i.test(ct)||r.request().resourceType()==='media')media.push({status:r.status(),host:new URL(r.url()).hostname,type:ct.split(';')[0]});});
            await p.goto('https://www.tabie.net/shows/1318',{waitUntil:'domcontentloaded',timeout:25000});
            await p.waitForTimeout(3000);
            console.log('TITLE',await p.title());console.log('BEFORE',(await p.locator('body').innerText()).slice(0,1000));
            console.log('CONTROLS',JSON.stringify(await p.locator('a,button,[role=button]').evaluateAll(es=>es.map(e=>({text:(e.innerText||e.getAttribute('aria-label')||'').trim().slice(0,80),href:e.tagName==='A'?e.getAttribute('href'):null})).filter(x=>x.text&&/تابع|الحلقة 1|تشغيل|مشاهدة|دخول/.test(x.text)).slice(0,30))));
            const start=p.getByText('تابع الآن',{exact:false}).filter({visible:true}).first();
            if(await start.count())await start.click({timeout:8000}).catch(e=>console.log('CLICK_ERR',e.message.slice(0,200)));
            await p.waitForTimeout(10000);
            console.log('AFTER',JSON.stringify({url:p.url(),title:await p.title(),text:(await p.locator('body').innerText()).slice(0,1200),videos:await p.locator('video').evaluateAll(vs=>vs.map(v=>({time:v.currentTime,duration:Number.isFinite(v.duration)?v.duration:null,width:v.videoWidth,height:v.videoHeight,ready:v.readyState,paused:v.paused,error:v.error?.message||null}))),media:media.slice(0,20),frames:p.frames().map(f=>{try{return new URL(f.url()).hostname}catch{return 'blank'}})}));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node audit.cjs
