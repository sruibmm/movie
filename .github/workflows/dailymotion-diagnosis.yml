name: Dailymotion public embed diagnosis
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect official returned embed
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json, re, html
          from urllib.parse import urlencode
          def fetch(url,referer=None):
              h={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
              if referer: h['Referer']=referer
              try: r=urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=12)
              except urllib.error.HTTPError as e: r=e
              return r.status,r.url,r.read(2000000).decode('utf-8','replace')
          url='https://www.dailymotion.com/services/oembed?'+urlencode({'url':'https://www.dailymotion.com/video/x6rtfip'})
          status,final,body=fetch(url)
          print('OEMBED',status)
          d=json.loads(body)
          print('HTML',d.get('html'))
          m=re.search(r'src=["\x27]([^"\x27]+)',d.get('html',''))
          if m:
              src=html.unescape(m.group(1))
              if src.startswith('https://geo.dailymotion.com/') or src.startswith('https://www.dailymotion.com/'):
                  status,final,body=fetch(src,'https://movie.o-a-f-a.workers.dev/')
                  print('RETURNED PLAYER',status,final,body[:200])
          PY
