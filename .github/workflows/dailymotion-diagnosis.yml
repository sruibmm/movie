name: Verify mobile Dailymotion automatic recovery
on:
  push:
    branches: [dailymotion-diagnosis]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa2cc8184537543657a41678a096e078c40f8711
      - name: Install and build
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install chromium
      - name: Test actual React player
        run: |
          cat > dm-check.html <<'HTML'
          <html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0"><div id="root" style="height:100dvh;width:100vw"></div><script type="module" src="/dm-check.jsx"></script></body></html>
          HTML
          cat > dm-check.jsx <<'JS'
          import React from 'react';
          import {createRoot} from 'react-dom/client';
          import Player from './src/DailymotionQualityPlayer.jsx';
          import './src/index.css';
          createRoot(document.getElementById('root')).render(<Player title="المشاغبون فى الجيش" src="https://geo.dailymotion.com/player/x8lr5.html?video=xay1vlq"/>);
          JS
          # Use the app's CSS entry when available; otherwise supply equivalent layout rules.
          if [ ! -f src/index.css ]; then
            sed -i '/import .*src\/index.css/d' dm-check.jsx
            sed -i 's|</head>|<style>.w-full{width:100%}.h-full{height:100%}.relative{position:relative}.absolute{position:absolute}.inset-0{inset:0}.flex{display:flex}.items-center{align-items:center}.justify-center{justify-content:center}.overflow-hidden{overflow:hidden}.bg-black{background:black}</style></head>|' dm-check.html
          fi
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          cat > check.cjs <<'JS'
          const {chromium,devices}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});
            const p=await b.newPage({...devices['iPhone 13']});
            await p.addInitScript(()=>{window.dailymotion={events:{VIDEO_PLAYING:'playing'},createPlayer:async(id,opts)=>{window.testOpts=opts;return {on(){},getState:async()=>({videoId:'xay1vlq',videoTime:0,videoQualitiesList:['380','720'],videoQuality:'Auto'}),setQuality:async(q)=>{window.requested=q},destroy(){}}}}});
            await p.goto('http://127.0.0.1:5173/dm-check.html');
            await p.waitForFunction(()=>window.requested==='720',{timeout:15000});
            console.log('QUALITY_REQUEST',await p.evaluate(()=>({quality:window.requested,autoplay:window.testOpts.params.autoplay})));
            const box=await p.locator('[id^=dm-]').boundingBox();if(!box||box.height<100)throw Error('Collapsed host '+JSON.stringify(box));
            console.log('MOBILE_HOST',JSON.stringify(box));
            await p.waitForSelector('[data-dm-mode=iframe] iframe',{timeout:15000});
            console.log('AUTO_RECOVERY',await p.locator('[data-dm-mode=iframe] iframe').getAttribute('src'));
            await p.close();
            const real=await b.newPage({...devices['iPhone 13']});
            await real.goto('http://127.0.0.1:5173/dm-check.html');
            await real.waitForTimeout(12000);
            console.log('REAL_MODE',await real.locator('[data-dm-mode]').getAttribute('data-dm-mode'));
            for(const f of real.frames()){if(f.url().includes('dailymotion.com')){console.log('REAL_FRAME',f.url().split('?')[0],(await f.locator('body').innerText().catch(()=>'' )).slice(0,300));console.log('REAL_VIDEO',await f.locator('video').evaluateAll(vs=>vs.map(v=>({time:v.currentTime,duration:v.duration,width:v.videoWidth,height:v.videoHeight,paused:v.paused}))).catch(()=>[]));}}
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.cjs
