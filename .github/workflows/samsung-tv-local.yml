name: Samsung TV local package
on:
  pull_request:
    branches: [cloudflare-ready]
    paths:
      - 'scripts/package-samsung-local.mjs'
      - 'public/tizen-shell.js'
      - '.github/workflows/samsung-tv-local.yml'
      - 'src/**'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:css
      - run: npx vite build --base ./ --target chrome94
      - run: node --check public/tizen-shell.js && node --check public/tv-navigation.js && node scripts/tv-speed-test.mjs && node scripts/tv-remote-test.mjs && node scripts/tv-youtube-bridge-test.mjs
      - run: node scripts/tv-preferences-test.mjs && node scripts/arabic-discovery-test.mjs && node scripts/tv-metadata-test.mjs
      - run: node scripts/package-samsung-local.mjs
        env:
          CINEMA_ICON_B64: ''
      - run: node scripts/cache-tv-artwork.mjs
      - run: npx --no-install esbuild src/main.jsx --bundle --platform=browser --format=iife --target=chrome94 --minify --define:process.env.NODE_ENV='"production"' --outfile=samsung-local-dist/cinema-app.js
      - run: |
          python - <<'PY'
          import re,pathlib
          p=pathlib.Path('samsung-local-dist/index.html')
          s=p.read_text()
          s,n=re.subn(r'<script[^>]*type="module"[^>]*src="[^"]+"[^>]*></script>', '<script defer src="./cinema-app.js"></script>',s)
          assert n==1, s
          p.write_text(s)
          assert 'cdn.tailwindcss.com' not in s and 'type="module"' not in s
          assert pathlib.Path('samsung-local-dist/cinema-app.js').stat().st_size>10000
          assert pathlib.Path('samsung-local-dist/cinema.css').stat().st_size>10000
          PY
          # Classic bundle is used on Tizen; omit redundant Vite JS output.
          rm -rf samsung-local-dist/assets
          cd samsung-local-dist
          zip -qr ../CinemaTV-Samsung-Local.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: CinemaTV-Samsung-Local
          path: CinemaTV-Samsung-Local.zip
          if-no-files-found: error
