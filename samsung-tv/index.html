<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0915"><title>Cinema TV</title><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://movie.o-a-f-a.workers.dev; img-src https: data:; media-src https: blob:;">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0c0915;color:#f6f3ff;font:18px Arial,sans-serif}body{padding:28px 4%;}button,input{font:inherit}button{border:2px solid transparent;border-radius:12px;background:#211a34;color:#fff;padding:12px 19px;cursor:pointer}button:focus,input:focus{outline:none;border-color:#b49aff;box-shadow:0 0 0 3px #7852ca}button.active{background:#7340d4}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-size:32px;font-weight:bold;letter-spacing:3px;color:#b99bff;direction:ltr}.tag{color:#b4aaca;font-size:16px}.nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.nav button{margin-left:8px;margin-bottom:8px}.status{color:#b4aaca;margin:12px 0;min-height:24px}.grid{display:flex;flex-wrap:wrap;margin:0 -9px}.tile{width:calc(20% - 18px);margin:9px;text-align:right;padding:8px;background:#191425;border:2px solid transparent;min-height:200px}.poster{display:block;width:100%;height:0;padding-bottom:146%;position:relative;overflow:hidden;border-radius:9px;background:#302443}.poster img{position:absolute;width:100%;height:100%;object-fit:cover;top:0;left:0}.tile strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:10px 0 5px;font-size:17px}.meta{font-size:14px;color:#b4aaca}.tile:focus{transform:scale(1.025);background:#34244f}.hero{display:flex;background:#1a1528;border-radius:18px;padding:24px;margin:16px 0}.hero img{width:160px;height:230px;object-fit:cover;background:#302443;border-radius:10px;margin-left:24px}.hero h1{font-size:32px;margin:0 0 10px}.hero p{line-height:1.7;color:#c9c0d6}.episodes button{width:calc(25% - 12px);margin:6px;text-align:right}.player{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;background:#000;z-index:20;display:none}.player video{width:100%;height:100%;object-fit:contain}.controls{position:absolute;bottom:0;left:0;right:0;background:rgba(17,11,30,.92);padding:18px 4%;}.controls button{margin:4px}.controls h2{margin:0 0 8px;font-size:22px}.controls input{width:100%;margin:10px 0;accent-color:#9a6bff}.hidden{display:none!important}#search{background:#171123;color:white;padding:12px;border:2px solid #38264e;border-radius:12px;width:300px}#more{display:block;margin:20px auto}#back{margin:12px 0}@media(max-width:900px){.tile{width:calc(25% - 18px)}.episodes button{width:calc(33% - 12px)}}@media(max-width:600px){body{padding:14px 3%}.tile{width:calc(33.33% - 18px)}.hero img{width:95px;height:145px}.hero h1{font-size:22px}.brand{font-size:24px}}
</style></head>
<body><header><div><div class="brand">CINEMA TV</div><div class="tag">سينما بيتك • الشاشة الكبيرة</div></div><div class="tag">مشاهدة مباشرة</div></header>
<main id="home"><div class="nav" id="nav"><button data-kind="all" class="active">الكل</button><button data-kind="tv">مسلسلات</button><button data-kind="movie">أفلام</button><button data-kind="play">مسرحيات</button><input id="search" placeholder="ابحث عن فيلم أو مسلسل"><button id="go">بحث</button><button id="refresh">تحديث</button></div><div id="status" class="status" role="status"></div><div id="grid" class="grid"></div><button id="more" class="hidden">عرض المزيد</button></main>
<main id="details" class="hidden"><button id="back">رجوع للمكتبة</button><div id="info"></div><div id="eps" class="episodes"></div></main>
<div id="player" class="player"><video id="video" playsinline></video><div id="controls" class="controls"><h2 id="playing"></h2><div id="videoStatus" role="status"></div><input id="seek" type="range" min="0" max="100" value="0" aria-label="موضع المشاهدة"><div id="clock" class="meta"></div><button id="pause">إيقاف مؤقت</button><button id="rewind">− 10 ثوانٍ</button><button id="forward">+ 10 ثوانٍ</button><button id="next">الحلقة التالية</button><button id="retry">إعادة المحاولة</button><button id="close">رجوع</button></div></div>
<script src="app.js"></script></body></html>
