<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>اختبار مشغّل السينما — دهشة</title><style>body{margin:0;background:#08070c;color:#eee;font:16px system-ui;padding:20px}main{max-width:900px;margin:auto}#video{width:100%;aspect-ratio:16/9;background:#000}iframe{width:100%;height:100%;border:0}button,a{display:inline-block;padding:12px;background:#7c3aed;color:#fff;border:0;border-radius:12px;margin:8px 0;text-decoration:none}#status{padding:12px;background:#1b1824;border-radius:12px}</style></head><body><main><h1>دهشة — الحلقة الأولى</h1><p>فحص المشغّل الرسمي داخل موقع السينما. لا يتم الانتقال إلى موقع خارجي.</p><div id="video"></div><p id="status">جاري تهيئة المشغّل…</p><button id="play">▶ تشغيل</button> <a href="/">العودة إلى السينما</a></main><script>
const status=document.getElementById('status');const f=document.createElement('iframe');f.id='watan-player';f.title='دهشة الحلقة الأولى';f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');f.setAttribute('sandbox','allow-scripts allow-same-origin allow-presentation');f.setAttribute('allow','autoplay; encrypted-media; fullscreen; picture-in-picture');f.allowFullscreen=true;f.src='https://www.youtube-nocookie.com/embed/Ag-fVJvmCic?playsinline=1&rel=0&enablejsapi=1&origin='+encodeURIComponent(location.origin);document.getElementById('video').append(f);
let player;window.onYouTubeIframeAPIReady=()=>{player=new YT.Player(f,{events:{onReady:e=>{status.textContent='Player ready — اضغط تشغيل';e.target.mute();e.target.playVideo();},onError:e=>{status.textContent='Player error '+e.data;},onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING)status.textContent='Playing — 0s';}}});setInterval(()=>{try{if(player.getPlayerState()===YT.PlayerState.PLAYING)status.textContent='Playing — '+Math.round(player.getCurrentTime())+'s';}catch{}},1000);};document.getElementById('play').onclick=()=>{try{player.unMute();player.playVideo();}catch{status.textContent='اضغط زر التشغيل داخل الفيديو.';}};const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.append(s);
</script></body></html>
