<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0915"><title>Cinema TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0c0915;color:#f6f3ff;font:18px Arial,sans-serif}body{padding:28px 4%;}button,input{font:inherit}button{border:2px solid transparent;border-radius:12px;background:#211a34;color:#fff;padding:12px 19px;cursor:pointer}button:focus,input:focus{outline:none;border-color:#b49aff;box-shadow:0 0 0 3px #7852ca}button.active{background:#7340d4}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-size:32px;font-weight:bold;letter-spacing:3px;color:#b99bff;direction:ltr}.tag{color:#b4aaca;font-size:16px}.nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.nav button{margin-left:8px;margin-bottom:8px}.status{color:#b4aaca;margin:12px 0;min-height:24px}.grid{display:flex;flex-wrap:wrap;margin:0 -9px}.tile{width:calc(20% - 18px);margin:9px;text-align:right;padding:8px;background:#191425;border:2px solid transparent;min-height:200px}.poster{display:block;width:100%;height:0;padding-bottom:146%;position:relative;overflow:hidden;border-radius:9px;background:#302443}.poster img{position:absolute;width:100%;height:100%;object-fit:cover;top:0;left:0}.tile strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:10px 0 5px;font-size:17px}.meta{font-size:14px;color:#b4aaca}.tile:focus{transform:scale(1.025);background:#34244f}.hero{display:flex;background:#1a1528;border-radius:18px;padding:24px;margin:16px 0}.hero img{width:160px;height:230px;object-fit:cover;background:#302443;border-radius:10px;margin-left:24px}.hero h1{font-size:32px;margin:0 0 10px}.hero p{line-height:1.7;color:#c9c0d6}.episodes button{width:calc(25% - 12px);margin:6px;text-align:right}.player{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;background:#000;z-index:20;display:none}.player video{width:100%;height:100%;object-fit:contain}.controls{position:absolute;bottom:0;left:0;right:0;background:rgba(17,11,30,.92);padding:18px 4%;}.controls button{margin:4px}.controls h2{margin:0 0 8px;font-size:22px}.controls input{width:100%;margin:10px 0;accent-color:#9a6bff}.hidden{display:none!important}#search{background:#171123;color:white;padding:12px;border:2px solid #38264e;border-radius:12px;width:300px}#more{display:block;margin:20px auto}#back{margin:12px 0}@media(max-width:900px){.tile{width:calc(25% - 18px)}.episodes button{width:calc(33% - 12px)}}@media(max-width:600px){body{padding:14px 3%}.tile{width:calc(33.33% - 18px)}.hero img{width:95px;height:145px}.hero h1{font-size:22px}.brand{font-size:24px}}
</style></head>
<body><header><div><div class="brand">CINEMA TV</div><div class="tag">سينما بيتك • الشاشة الكبيرة</div></div><div class="tag">مشاهدة مباشرة</div></header>
<main id="home"><div class="nav" id="nav"><button data-kind="all" class="active">الكل</button><button data-kind="tv">مسلسلات</button><button data-kind="movie">أفلام</button><button data-kind="play">مسرحيات</button><input id="search" placeholder="ابحث عن فيلم أو مسلسل"><button id="go">بحث</button><button id="refresh">تحديث</button></div><div id="status" class="status" role="status"></div><div id="grid" class="grid"></div><button id="more" class="hidden">عرض المزيد</button></main>
<main id="details" class="hidden"><button id="back">رجوع للمكتبة</button><div id="info"></div><div id="eps" class="episodes"></div></main>
<div id="player" class="player"><video id="video" playsinline></video><div id="controls" class="controls"><h2 id="playing"></h2><div id="videoStatus" role="status"></div><input id="seek" type="range" min="0" max="100" value="0" aria-label="موضع المشاهدة"><div id="clock" class="meta"></div><button id="pause">إيقاف مؤقت</button><button id="rewind">− 10 ثوانٍ</button><button id="forward">+ 10 ثوانٍ</button><button id="next">الحلقة التالية</button><button id="retry">إعادة المحاولة</button><button id="close">رجوع</button></div></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)},kind='all',query='',cursor=null,cards=[],busy=false,gen=0,work=null,slots=[],current=-1,screen='home',hideTimer=0,lastTile=null;
function request(route,params,cb){var x=new XMLHttpRequest(),q=[],k;for(k in params)if(Object.prototype.hasOwnProperty.call(params,k))q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]));x.open('GET','/api/private-catalog/'+route+'?'+q.join('&'),true);x.timeout=25000;x.onload=function(){try{if(x.status!==200)throw Error('HTTP '+x.status);cb(null,JSON.parse(x.responseText));}catch(e){cb(e);}};x.onerror=x.ontimeout=function(){cb(Error('network'));};x.send();}
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n;}
function https(s){return typeof s==='string'&&s.indexOf('https://')===0?s:'';}
function show(id){screen=id;$('home').className=id==='home'?'':'hidden';$('details').className=id==='details'?'':'hidden';$('player').style.display=id==='player'?'block':'none';}
function posKey(e){return 'cinema-tv-pos:'+work.id+':'+e.season+':'+e.episode}
function readPos(e){try{return Number(localStorage.getItem(posKey(e)))||0;}catch(x){return 0}}
function save(){var v=$('video');if(work&&slots[current]&&isFinite(v.currentTime)&&v.currentTime>0)try{localStorage.setItem(posKey(slots[current]),String(v.duration-v.currentTime<5?0:v.currentTime));}catch(x){}}
function art(parent,url,alt){var p=el('span','poster'),im=el('img');im.alt=alt||'';if(https(url))im.src=url;im.onerror=function(){im.style.display='none';};p.appendChild(im);parent.appendChild(p);}
function render(){var g=$('grid');g.innerHTML='';cards.forEach(function(t){var b=el('button','tile');art(b,t.poster||t.banner,t.title);b.appendChild(el('strong','',t.title));b.appendChild(el('span','meta',[t.year,t.kind==='tv'&&t.count?t.count+' حلقة':t.kind==='movie'?'فيلم':''].filter(Boolean).join(' · ')));b.onclick=function(){lastTile=b;open(t)};g.appendChild(b);});$('more').className=cursor?'':'hidden';}
function load(reset){if(busy&&!reset)return;var n=++gen;busy=true;$('status').textContent='جاري تحميل المكتبة…';request('list',{kind:kind,q:query,cursor:reset?'0':cursor||'0'},function(err,data){if(n!==gen)return;busy=false;if(err){$('status').textContent='تعذر تحديث المكتبة. حاول مجدداً.';return;}cards=reset?data.titles:cards.concat(data.titles);cursor=data.next;render();$('status').textContent=data.total+' عمل • اختر ما تريد مشاهدته';try{if(reset)localStorage.setItem('cinema-tv-list:'+kind+':'+query,JSON.stringify(data));}catch(e){}if(reset&&$('grid').firstChild)$('grid').firstChild.focus();});}
function restore(){try{var d=JSON.parse(localStorage.getItem('cinema-tv-list:'+kind+':'+query));if(d&&d.titles){cards=d.titles;cursor=d.next;render();}}catch(e){}load(true)}
function open(t){var n=++gen;busy=false;work=t;show('details');$('info').textContent='جاري تحميل التفاصيل…';$('eps').innerHTML='';$('back').focus();request('work',{id:t.id},function(err,w){if(n!==gen)return;if(!err&&w&&w.assets&&w.assets.length&&!w.partial&&!w.recovery){details(w);return;}request('preview',{id:t.id},function(e,p){if(n!==gen)return;if(e){if(w&&w.assets&&w.assets.length)details(w);else $('info').textContent='تعذر فتح العمل. ارجع وحاول مجدداً.';return;}if(w&&w.assets)p.assets=w.assets;details(p);});});}
function details(w){work=w;var map={},i;function add(a){if(!a)return;for(var j=0;j<a.length;j++){var e=a[j];if(e.season>0&&e.episode>0)map[e.season+':'+e.episode]=e;}}add(w.slots);add(w.assets);slots=Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.season-b.season||a.episode-b.episode});var info=$('info');info.innerHTML='';var hero=el('div','hero'),im=el('img');if(https(w.poster||w.banner))im.src=w.poster||w.banner;im.alt=w.title;hero.appendChild(im);var txt=el('div');txt.appendChild(el('h1','',w.title));txt.appendChild(el('div','meta',[w.year,w.kind==='tv'?(w.count||slots.length)+' حلقة':'فيلم / مسرحية'].filter(Boolean).join(' · ')));txt.appendChild(el('p','',w.story||''));var start=el('button','active','▶ شاهد الآن');start.onclick=function(){play(0)};if(slots.length)txt.appendChild(start);hero.appendChild(txt);info.appendChild(hero);var ep=$('eps');ep.innerHTML='';slots.forEach(function(e,j){var b=el('button','',(w.kind==='tv'?'الموسم '+e.season+' · الحلقة '+e.episode:'▶ مشاهدة')+(readPos(e)>20?' · استكمال':''));b.onclick=function(){play(j)};ep.appendChild(b)});if(!slots.length)ep.textContent='لا توجد حلقات مفهرسة حالياً';if(slots.length)start.focus();}
function reveal(){var c=$('controls');c.className='controls';clearTimeout(hideTimer);hideTimer=setTimeout(function(){if(!$('video').paused){c.className='controls hidden';$('video').focus();}},6500)}
function play(i){if(i<0||i>=slots.length)return;save();var e=slots[i],n=++gen,v=$('video');current=i;v.pause();v.removeAttribute('src');v.load();show('player');$('playing').textContent=work.title+(work.kind==='tv'?' · الحلقة '+e.episode:'');$('videoStatus').textContent='جاري تجهيز الفيديو…';$('next').className=i+1<slots.length?'':'hidden';$('retry').className='hidden';reveal();$('close').focus();function start(url){if(n!==gen)return;if(!https(url)){fail();return;}v.src=url;v.load();v.play();}function fail(){if(n!==gen)return;$('videoStatus').textContent='هذا الفيديو غير متاح من المصدر حالياً.';$('retry').className='';reveal();$('retry').focus();}if(https(e.url))start(e.url);else request('episode',{id:work.id,season:e.season,episode:e.episode},function(err,a){if(err||a.id!==work.id+':s'+e.season+':e'+e.episode||a.season!==e.season||a.episode!==e.episode){fail();return;}start(a.url);});}
var v=$('video');v.tabIndex=0;v.onloadedmetadata=function(){var p=readPos(slots[current]);if(p>0&&p<v.duration-5)v.currentTime=p;$('videoStatus').textContent='';$('seek').max=Math.max(1,Math.floor(v.duration)||1);$('pause').focus();reveal();};v.ontimeupdate=function(){if(isFinite(v.duration)){$('seek').value=Math.floor(v.currentTime);$('clock').textContent=Math.floor(v.currentTime/60)+':'+('0'+Math.floor(v.currentTime%60)).slice(-2)+' / '+Math.floor(v.duration/60)+':'+('0'+Math.floor(v.duration%60)).slice(-2);}};v.onplay=function(){$('pause').textContent='إيقاف مؤقت';reveal()};v.onpause=function(){$('pause').textContent='تشغيل';reveal()};v.onerror=function(){if(screen==='player'){$('videoStatus').textContent='تعذر تشغيل الفيديو على هذا الجهاز.';$('retry').className='';reveal();}};v.onended=function(){save();if(current+1<slots.length)play(current+1);else close()};setInterval(function(){if(screen==='player')save()},5000);
function close(){save();gen++;v.pause();v.removeAttribute('src');v.load();show('details');$('back').focus();}
function home(){gen++;show('home');if(lastTile&&lastTile.parentNode)lastTile.focus();else if($('grid').firstChild)$('grid').firstChild.focus();}
$('back').onclick=home;$('close').onclick=close;$('retry').onclick=function(){play(current)};$('next').onclick=function(){play(current+1)};$('pause').onclick=function(){if(v.paused)v.play();else v.pause();reveal()};$('rewind').onclick=function(){v.currentTime=Math.max(0,v.currentTime-10);reveal()};$('forward').onclick=function(){v.currentTime=Math.min(v.duration||0,v.currentTime+10);reveal()};$('seek').onchange=function(){if(isFinite(v.duration))v.currentTime=Number(this.value)};$('more').onclick=function(){load(false)};$('refresh').onclick=function(){load(true)};$('go').onclick=function(){query=$('search').value.trim();restore()};$('search').onkeydown=function(e){if(e.keyCode===13){$('go').click();e.preventDefault()}};var nav=$('nav').querySelectorAll('[data-kind]');for(var i=0;i<nav.length;i++)nav[i].onclick=function(){for(var j=0;j<nav.length;j++)nav[j].className='';this.className='active';kind=this.getAttribute('data-kind');query='';$('search').value='';restore()};
document.addEventListener('keydown',function(e){var k=e.keyCode;if(k===10009||k===461||k===27||k===8&&document.activeElement.tagName!=='INPUT'){if(screen==='player')close();else if(screen==='details')home();else return;e.preventDefault();return;}if(screen==='player'&&$('controls').className.indexOf('hidden')>=0){reveal();$('pause').focus();e.preventDefault();return;}if(k<37||k>40||document.activeElement.tagName==='INPUT')return;var a=document.activeElement,r=a.getBoundingClientRect(),x=(r.left+r.right)/2,y=(r.top+r.bottom)/2,all=document.querySelectorAll('button,input,video'),best=null,score=Infinity;for(var j=0;j<all.length;j++){var t=all[j];if(t===a||!t.offsetWidth||!t.offsetHeight||t.disabled)continue;var q=t.getBoundingClientRect(),dx=(q.left+q.right)/2-x,dy=(q.top+q.bottom)/2-y,along=k===37?-dx:k===39?dx:k===38?-dy:dy,cross=k===37||k===39?Math.abs(dy):Math.abs(dx);if(along>4&&along+cross*3<score){score=along+cross*3;best=t}}if(best){best.focus();e.preventDefault();if(screen==='player')reveal();}});
restore();
})();
</script></body></html>
